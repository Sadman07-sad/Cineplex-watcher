name: Star Cineplex watcher

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:
    inputs:
      test_message:
        description: 'Only send a Telegram test message'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stop if already alerted
        id: done
        run: |
          if [ -f state.json ] && grep -q '"on_sale"' state.json; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.done.outputs.skip != '1'
        with:
          node-version: 20

      - name: Install browser
        if: steps.done.outputs.skip != '1'
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Check Star Cineplex
        if: steps.done.outputs.skip != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test_message && '1' || '0' }}
        run: node watch.js

      - name: Save state
        if: steps.done.outputs.skip != '1'
        run: |
          git config user.name "cineplex-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          # only commit when an alert/error state changed (not just last_check)
          if git diff --cached --quiet; then exit 0; fi
          if git diff --cached -U0 state.json | grep -E '^[+-] ' | grep -vq '"last_check"'; then
            git commit -m "Update watcher state"
            git push
          fi
